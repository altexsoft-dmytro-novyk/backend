services:
  localstack:
    image: localstack/localstack
    restart: unless-stopped
    env_file: .env
    ports:
      - '${LOCALSTACK_PORT:-4566}:4566'
    environment:
      - SERVICES=s3
      - DEBUG=1
      - CLEAR_TMP_FOLDER=0
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
      # 2026.03.0+ unified image requires this (free Hobby plan at
      # localstack.cloud); sourced from .env via env_file above, not
      # committed. The old no-token bypass
      # (LOCALSTACK_ACKNOWLEDGE_ACCOUNT_REQUIREMENT) expired 2026-04-06.
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://127.0.0.1:4566/_localstack/health | grep -q ''"s3": "available"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PG18 image: mount at /var/lib/postgresql (PGDATA is version-specific inside)
      - pgdata:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1 forces TCP: socket-based check can report healthy too early
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  localstack-data:
